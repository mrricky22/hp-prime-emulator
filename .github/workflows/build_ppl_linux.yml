name: Build Linux PPL checker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake libudev-dev pkg-config
      - name: Build the PPL CLI
        run: cargo build --locked --release --bin ppl
      - name: Upload downloadable Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: ppl-linux-x86_64
          path: target/release/ppl
          if-no-files-found: error

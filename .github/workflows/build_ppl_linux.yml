
name: Build Linux PPL Checker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            cmake \
            libudev-dev \
            pkg-config

      - name: Build PPL CLI
        run: |
          cargo build --locked --release -p ppl-cli --bin ppl

      - name: Locate compiled executable
        shell: bash
        run: |
          echo "Cargo target directory: $CARGO_TARGET_DIR"
          echo "Looking for PPL executable..."

          find "$CARGO_TARGET_DIR" -type f -name "ppl" -print

          echo "Release directory:"
          ls -lah "$CARGO_TARGET_DIR/release/"

      - name: Prepare executable
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          BINARY="$CARGO_TARGET_DIR/release/ppl"

          if [ ! -f "$BINARY" ]; then
            BINARY=$(find "$CARGO_TARGET_DIR" \
              -type f -name "ppl" -perm /111 \
              -print -quit)
          fi

          if [ -z "$BINARY" ] || [ ! -f "$BINARY" ]; then
            echo "ERROR: Compiled PPL executable not found!"
            exit 1
          fi

          cp "$BINARY" dist/ppl
          chmod +x dist/ppl

          echo "Executable information:"
          file dist/ppl

          echo "Testing CLI:"
          ./dist/ppl --help

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: ppl-linux-x86_64
          path: dist/ppl
          if-no-files-found: error
          retention-days: 7
